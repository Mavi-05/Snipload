name: Windows-Build

# Baut bei jeder Aenderung am Code automatisch eine neue Snipload.exe
# und stellt sie unter "Releases" zum Download bereit.
on:
  push:
    branches: [main, v4-wip]     # v4-wip: nur bauen und testen, nichts veroeffentlichen
    paths:
      - "src/**"
      - "assets/**"
      - "tools/**"
      - "requirements.txt"
      - "LICENSE"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt pyinstaller

      - name: Versionsnummer bestimmen
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path src/snipload/__init__.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          "full=$v.${{ github.run_number }}" >> $env:GITHUB_OUTPUT
          "tag=v$v.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Versionsinfo erzeugen
        run: python tools/make_version_info.py "${{ steps.ver.outputs.full }}"

      - name: exe bauen
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Snipload
          --icon assets/icon.ico
          --add-data "assets/icon.ico;."
          --add-data "assets/icon.png;."
          --add-data "assets/haarcascade_frontalface_default.xml;."
          --add-data "assets/haarcascade_frontalface_alt2.xml;."
          --add-data "assets/haarcascade_profileface.xml;."
          --add-data "src/snipload/web;web"
          --add-data "LICENSE;web"
          --version-file tools/version_info.txt
          --paths src
          src/main.py

      - name: Selbsttest (OpenCV, Gesichtserkennung, Oberflaeche in der exe)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Snipload.exe" -ArgumentList "--selftest", "selftest.txt" -PassThru -Wait
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { Write-Error "Selbsttest fehlgeschlagen"; exit 1 }

      - name: Probe mit echtem Internet (Twitch, YouTube, Rendern, KI-Untertitel) - nur zum Nachsehen
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 25
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$PWD\testdaten\local"
          $env:APPDATA = "$PWD\testdaten\roaming"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA, $env:APPDATA | Out-Null
          $p = Start-Process -FilePath "dist/Snipload.exe" -ArgumentList "--nettest", "nettest.txt" -PassThru
          $deadline = (Get-Date).AddMinutes(22)
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 5 }
          if (-not $p.HasExited) { $p | Stop-Process -Force }
          if (Test-Path nettest.txt) { Get-Content nettest.txt -Encoding UTF8 }

      - name: Starttest (erscheint das Fenster, laedt die Oberflaeche ohne Fehler?)
        shell: pwsh
        run: |
          $full = "${{ github.ref }}" -ne "refs/heads/main"
          if ($full) {
            # Testzweig: mit den eben geladenen Werkzeugen ein echtes Twitch-VOD oeffnen und abspielen
            $env:LOCALAPPDATA = "$PWD\testdaten\local"
            $env:APPDATA = "$PWD\testdaten\roaming"
            New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA, $env:APPDATA | Out-Null
            $env:SNIPLOAD_UITEST_FULL = "1"
          }
          $env:SNIPLOAD_UITEST = "$PWD\uitest.json"
          function Shot($name) {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($name)
          }
          function WaitFor($file, $seconds) {
            $deadline = (Get-Date).AddSeconds($seconds)
            while ((Get-Date) -lt $deadline) { if (Test-Path $file) { return $true }; Start-Sleep -Seconds 2 }
            return $false
          }
          $p = Start-Process -FilePath "dist/Snipload.exe" -PassThru
          $ok = WaitFor "uitest.json" 90
          $win = Get-Process -Name Snipload -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -like "Snipload*" }
          Get-Process -Name Snipload -ErrorAction SilentlyContinue | Format-Table Id, MainWindowTitle -AutoSize
          Start-Sleep -Seconds 1
          Shot "Snipload-Vorschau.png"
          if ($full -and $ok) {
            if (WaitFor "uitest2.json" 260) { Start-Sleep -Seconds 1; Shot "Snipload-Vorschau-2.png"; Get-Content uitest2.json }
            if (WaitFor "uitest3.json" 120) { Start-Sleep -Seconds 1; Shot "Snipload-Vorschau-3.png"; Get-Content uitest3.json }
          }
          Get-Process -Name Snipload -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path uitest.json) { Get-Content uitest.json }
          if (-not $ok -or -not $win) {
            Write-Error "Snipload hat kein Fenster geoeffnet oder die Oberflaeche nicht geladen."
            exit 1
          }
          $r = Get-Content uitest.json -Raw | ConvertFrom-Json
          if (-not $r.ok) { Write-Error "Die Oberflaeche wurde nicht fehlerfrei geladen."; exit 1 }
          Write-Host "Fenster ist erschienen und die Oberflaeche laeuft - Starttest bestanden."

      - name: Bildschirmfotos in den Zweig ci-vorschau legen (nur Testzweig)
        if: github.ref != 'refs/heads/main' && always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p vorschau
          cp Snipload-Vorschau*.png uitest*.json nettest.txt selftest.txt vorschau/ 2>/dev/null || true
          cd vorschau
          git init -q
          git checkout -q -b ci-vorschau
          git add -A
          git -c user.name="Snipload CI" -c user.email="ci@users.noreply.github.com" commit -q -m "Vorschau ${{ steps.ver.outputs.full }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-vorschau

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vorschau-${{ steps.ver.outputs.full }}
          path: |
            Snipload-Vorschau*.png
            uitest*.json
            selftest.txt
            nettest.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: Snipload-${{ steps.ver.outputs.full }}
          path: dist/Snipload.exe

      - name: Release veroeffentlichen
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Snipload ${{ steps.ver.outputs.full }}
          make_latest: true
          body: |
            **Download:** click `Snipload.exe` under *Assets* below, download it and run it – no installation needed.
            Already using Snipload? It updates itself automatically.

            On the first start Windows may show "Windows protected your PC" – click *More info* → *Run anyway*.

            Snipload is free to use, but it may not be copied, uploaded elsewhere or passed off as your own – see [LICENSE](https://github.com/Mavi-05/Snipload/blob/main/LICENSE).

            What's new: ${{ github.event.head_commit.message }}
          files: |
            dist/Snipload.exe
            Snipload-Vorschau.png

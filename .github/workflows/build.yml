name: Windows-Build

# Baut bei jeder Aenderung am Code automatisch eine neue Snipload.exe
# und stellt sie unter "Releases" zum Download bereit.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "assets/**"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt pyinstaller

      - name: Versionsnummer bestimmen
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path src/snipload/__init__.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          "full=$v.${{ github.run_number }}" >> $env:GITHUB_OUTPUT
          "tag=v$v.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Versionsinfo erzeugen
        run: python tools/make_version_info.py "${{ steps.ver.outputs.full }}"

      - name: exe bauen
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Snipload
          --icon assets/icon.ico
          --add-data "assets/icon.ico;."
          --add-data "assets/icon.png;."
          --version-file tools/version_info.txt
          --paths src
          src/main.py

      - name: Starttest (erscheint das Fenster wirklich?)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Snipload.exe" -PassThru
          $ok = $false
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline) {
            $win = Get-Process -Name Snipload -ErrorAction SilentlyContinue |
                   Where-Object { $_.MainWindowTitle -like "Snipload*" }
            if ($win) { $ok = $true; break }
            Start-Sleep -Seconds 2
          }
          Get-Process -Name Snipload -ErrorAction SilentlyContinue | Format-Table Id, MainWindowTitle -AutoSize
          if ($ok) {
            Start-Sleep -Seconds 4
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("Snipload-Vorschau.png")
            Write-Host "Snipload-Fenster ist erschienen - Starttest bestanden."
          }
          Get-Process -Name Snipload -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) {
            Write-Error "Snipload hat kein Fenster geoeffnet (Absturz oder Fehlermeldung beim Start)."
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Snipload-${{ steps.ver.outputs.full }}
          path: dist/Snipload.exe

      - name: Release veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Snipload ${{ steps.ver.outputs.full }}
          make_latest: true
          body: |
            **Download:** `Snipload.exe` unten bei *Assets* anklicken, herunterladen, starten.

            Beim ersten Start zeigt Windows evtl. „Der Computer wurde durch Windows geschuetzt" –
            dann auf „Weitere Informationen" und „Trotzdem ausfuehren" klicken.

            Aenderung: ${{ github.event.head_commit.message }}
          files: |
            dist/Snipload.exe
            Snipload-Vorschau.png
